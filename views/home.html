<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tPlan - Gestionnaire de tâches</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://unpkg.com/@coreui/icons/css/all.min.css">
</head>
<body>
    <nav>
        <button><i class="fa-solid fa-bars"></i></button>
    </nav>
    <main class="FlexCenter">
        
        <div class="PlacementIframes">
            <div class="iframe-tile left" data-id="agenda"><div class="tile-controls"><button class="drag-handle" type="button" aria-label="Déplacer Agenda" title="Déplacer">⠿</button><button class="expand-tile" type="button" aria-label="Agrandir Agenda" title="Agrandir">⛶</button></div><iframe title="Agenda" src="./source/agenda.html" loading="lazy" allowfullscreen=""></iframe></div>
            <div class="iframe-tile top-right" data-id="taches"><div class="tile-controls"><button class="drag-handle" type="button" aria-label="Déplacer Tâches" title="Déplacer">⠿</button><button class="expand-tile" type="button" aria-label="Agrandir Tâches" title="Agrandir">⛶</button></div><iframe title="Tâches" src="./source/tache.html" loading="lazy" allowfullscreen=""></iframe></div>
            <div class="iframe-tile bottom-right" data-id="bloc-note"><div class="tile-controls"><button class="drag-handle" type="button" aria-label="Déplacer Pense-bête" title="Déplacer">⠿</button><button class="expand-tile" type="button" aria-label="Agrandir Pense-bête" title="Agrandir">⛶</button></div><iframe title="Pense-bête" src="./source/bloc-note.html" loading="lazy" allowfullscreen=""></iframe></div>
        </div>

    </main>
    <footer class="FlexCenter2">
        <div class="spotify" hidden>
            <input id="lienSpotify" placeholder="Lien Playlist">
            <iframe id="playerSpotify" title="Lecteur Spotify" allow="encrypted-media" loading="lazy"></iframe>
        </div>
        <button id="toggleEditMode" type="button" aria-label="Activer le mode éditeur" aria-pressed="false" style="background: rgb(255, 208, 0);"><i class="fa-solid fa-pen-to-square"></i></button>
        <button id="toggleSpotify" type="button" aria-label="Afficher Spotify" aria-expanded="false" style="background: black;"><i class="cib-spotify"></i></button>
    </footer>
</body>
<script src="../controller/indexPoint.js" type="module"></script>
</html>
