<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tPlan - Gestionnaire de tâches</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://unpkg.com/@coreui/icons/css/all.min.css">
    <script src="../controller/module.js" type="module"></script>
</head>
<body>
    <nav id="baredenavigation">
        <button id="ouvrirPersonnalisation" type="button" aria-label="Personnaliser la page" aria-haspopup="dialog" aria-controls="personnalisation" aria-expanded="false"><i class="fa-solid fa-layer-group"></i></button>
    </nav>
    <dialog id="personnalisation" aria-labelledby="personnalisationTitre">
        <header class="preferences-header">
            <div><h1 id="personnalisationTitre">Votre espace, votre style</h1><p>Personnalisez votre tableau de bord.</p></div>
            <button id="fermerPersonnalisation" type="button" aria-label="Fermer">×</button>
        </header>
        <fieldset>
            <legend>Thème</legend>
            <div class="preferences-options">
                <button type="button" class="preference-choice" data-theme-choice="clair" aria-pressed="true"><span class="preference-preview preview-clair" aria-hidden="true"></span>Claire</button>
                <button type="button" class="preference-choice" data-theme-choice="sombre" aria-pressed="false"><span class="preference-preview preview-sombre" aria-hidden="true"></span>Sombre</button>
                <button type="button" class="preference-choice" data-theme-choice="vintage" aria-pressed="false"><span class="preference-preview preview-vintage" aria-hidden="true"></span>Vintage</button>
            </div>
        </fieldset>
        <fieldset>
            <legend>Couleur</legend>
            <div class="preferences-options preferences-colors">
                <button type="button" class="preference-choice" data-color-choice="vert" aria-pressed="true"><span class="preference-preview" style="background-image: linear-gradient(#1f7a63, #1f7a63)" aria-hidden="true"></span>Vert</button>
                <button type="button" class="preference-choice" data-color-choice="jaune" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#e2b62e, #e2b62e)" aria-hidden="true"></span>Jaune</button>
                <button type="button" class="preference-choice" data-color-choice="noir" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#242424, #242424)" aria-hidden="true"></span>Noir</button>
                <button type="button" class="preference-choice" data-color-choice="violet" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#8054c7, #8054c7)" aria-hidden="true"></span>Violet</button>
                <button type="button" class="preference-choice" data-color-choice="bleu" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#3277ca, #3277ca)" aria-hidden="true"></span>Bleu</button>
                <button type="button" class="preference-choice" data-color-choice="bordeaux" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#852c48, #852c48)" aria-hidden="true"></span>Bordeaux</button>
                <button type="button" class="preference-choice" data-color-choice="rouge" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#bd3434, #bd3434)" aria-hidden="true"></span>Rouge</button>
                <button type="button" class="preference-choice" data-color-choice="orange" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#b85c16, #b85c16)" aria-hidden="true"></span>Orange</button>
                <button type="button" class="preference-choice" data-color-choice="magenta" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#ae287b, #ae287b)" aria-hidden="true"></span>Magenta</button>
                <button type="button" class="preference-choice" data-color-choice="cyan" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#087b8c, #087b8c)" aria-hidden="true"></span>Cyan</button>
                <button type="button" class="preference-choice" data-color-choice="gris" aria-pressed="false"><span class="preference-preview" style="background-image: linear-gradient(#606773, #606773)" aria-hidden="true"></span>Gris</button>
            </div>
        </fieldset>
        <fieldset>
            <legend>Disposition des blocs</legend>
            <div class="preferences-options">
                <button type="button" class="preference-choice" data-grid-choice="actuel" aria-pressed="true"><span class="preference-preview preview-actuel" aria-hidden="true"></span>Par défaut</button>
                <button type="button" class="preference-choice" data-grid-choice="inverse" aria-pressed="false"><span class="preference-preview preview-inverse" aria-hidden="true"></span>Inversée</button>
                <button type="button" class="preference-choice" data-grid-choice="colonnes" aria-pressed="false"><span class="preference-preview preview-colonnes" aria-hidden="true"></span>Trois colonnes</button>
            </div>
        </fieldset>
        <p class="preferences-hint" id="preferencesStatut" role="status">Vos choix sont enregistrés automatiquement.</p>
    </dialog>
    <main class="FlexCenter">
        
        <div class="PlacementIframes">
            <div class="iframe-tile left" data-id="agenda">
                <div class="tile-controls">
                    <button class="drag-handle" type="button" aria-label="Déplacer Agenda" title="Déplacer"><i class="fa-solid fa-grip"></i></button>
                    <button class="expand-tile" type="button" aria-label="Agrandir Agenda" title="Agrandir"><i class="fa-solid fa-expand"></i></button>
                </div>
                <iframe title="Agenda" src="./source/agenda.html" loading="lazy" allowfullscreen=""></iframe>
            </div>
            <div class="iframe-tile top-right" data-id="taches">
                <div class="tile-controls">
                    <button class="drag-handle" type="button" aria-label="Déplacer Tâches" title="Déplacer"><i class="fa-solid fa-grip"></i></button>
                    <button class="expand-tile" type="button" aria-label="Agrandir Tâches" title="Agrandir"><i class="fa-solid fa-expand"></i></button>
                </div>
                <iframe title="Tâches" src="./source/tache.html" loading="lazy" allowfullscreen=""></iframe>
            </div>
            <div class="iframe-tile bottom-right" data-id="bloc-note">
                <div class="tile-controls">
                    <button class="drag-handle" type="button" aria-label="Déplacer Pense-bête" title="Déplacer"><i class="fa-solid fa-grip"></i></button>
                    <button class="expand-tile" type="button" aria-label="Agrandir Pense-bête" title="Agrandir"><i class="fa-solid fa-expand"></i></button>
                </div>
                <iframe title="Pense-bête" src="./source/bloc-note.html" loading="lazy" allowfullscreen=""></iframe>
            </div>
        </div>
        <button class="fullscreen-nav fullscreen-prev" type="button" aria-label="Panneau précédent" title="Panneau précédent" hidden><span aria-hidden="true"><i class="fa-solid fa-chevron-left"></i></span></button>
        <button class="fullscreen-nav fullscreen-next" type="button" aria-label="Panneau suivant" title="Panneau suivant" hidden><span aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span></button>

    </main>
    <footer class="FlexCenter2">
        <div class="spotify" hidden>
            <input id="lienSpotify" placeholder="Lien Playlist">
            <iframe id="playerSpotify" title="Lecteur Spotify" allow="encrypted-media" loading="lazy"></iframe>
        </div>
        <button id="toggleEditMode" type="button" aria-label="Activer le mode éditeur" aria-pressed="false" style="background: #1f7a63;"><i class="fa-solid fa-pen-to-square"></i></button>
        <button id="toggleSpotify" type="button" aria-label="Afficher Spotify" aria-expanded="false" style="background: black;"><i class="cib-spotify"></i></button>
    </footer>
</body>
</html>
