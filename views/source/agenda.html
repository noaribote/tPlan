<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="../../assets/css/source/agenda.css">
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <button id="prev" aria-label="Précédent">‹</button>
      <button id="today">Aujourd'hui</button>
      <button id="next" aria-label="Suivant">›</button>
      <h1 id="title"></h1>
    </div>
    <div class="filters">
      <label class="chip pro"><input type="checkbox" id="chk-pro" checked> Professionnel</label>
      <label class="chip perso"><input type="checkbox" id="chk-perso" checked> Personnel</label>
    </div>
  </header>

  <main id="calendar"></main>

  <footer class="zoombar">
    <button id="zoom-out" aria-label="Dézoomer">−</button>
    <span id="view-label"></span>
    <button id="zoom-in" aria-label="Zoomer">+</button>
  </footer>

  <script src="../../controller/agenda.js"></script>
</body>
</html>
