<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="../../assets/css/source/bloc-note.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Bloc-notes</h1>
      <div class="app__header-actions">
        <p class="app__compteur" id="compteur">0 note</p>
        <button type="button" class="btn-ajouter" id="ouvrir-modal">Ajouter une note</button>
      </div>
    </header>

    <p class="empty-state" id="empty-state" hidden>
      Aucune note pour le moment. Cliquez sur « Ajouter une note » pour commencer.
    </p>
    <section id="liste" class="liste" aria-label="Mes notes"></section>
  </main>

  <dialog class="modal" id="note-modal" aria-labelledby="modal-titre">
    <form id="formulaire">
      <div class="modal__header">
        <h2 id="modal-titre">Ajouter une note</h2>
        <button type="button" class="modal__fermer" id="fermer-modal" aria-label="Fermer">×</button>
      </div>
      <div class="modal__contenu">
        <label for="titre">Titre</label>
        <input id="titre" name="titre" type="text" placeholder="Ex. : Courses de la semaine" maxlength="100" required>
        <label for="contenu">Note</label>
        <textarea id="contenu" name="contenu" rows="5" placeholder="Écris ta note ici…" maxlength="5000" required></textarea>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn-annuler" id="annuler-modal">Annuler</button>
        <button type="submit" class="btn-enregistrer">Ajouter la note</button>
      </div>
    </form>
  </dialog>

  <script src="../../controller/bloc-note.js"></script>
</body>
</html>
